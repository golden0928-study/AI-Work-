<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 AI Prompt 智能寶庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════
   RESET & TOKENS
════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #edf0f7;
  --surface:      #ffffff;
  --surface-2:    #f8f9fc;
  --primary:      #3b82f6;
  --primary-d:    #2563eb;
  --primary-glow: rgba(59,130,246,.18);
  --violet:       #7c3aed;
  --violet-l:     #a78bfa;
  --success:      #10b981;
  --border:       #dde3ef;
  --text:         #1a2235;
  --text-2:       #475569;
  --text-3:       #94a3b8;
  --shadow-sm:    0 1px 4px rgba(0,0,0,.07);
  --shadow-md:    0 6px 24px rgba(37,99,235,.11), 0 1px 4px rgba(0,0,0,.06);
  --r-card:       16px;
  --r-btn:        10px;
  --r-pill:       50px;
  --font:         'Noto Sans TC', sans-serif;
}

html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ════════════════════════════════
   HEADER
════════════════════════════════ */
.header {
  background: linear-gradient(170deg, #f5f7ff 0%, var(--bg) 100%);
  padding: 44px 24px 28px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: clamp(1.55rem, 4vw, 2.2rem);
  font-weight: 900;
  letter-spacing: -.3px;
  color: var(--text);
  margin-bottom: 6px;
}
.sheet-link {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: .82rem; color: var(--primary);
  text-decoration: none; font-weight: 500;
  opacity: .8; transition: opacity .2s;
}
.sheet-link:hover { opacity: 1; text-decoration: underline; }

/* ── Search ── */
.search-wrap {
  max-width: 560px; margin: 22px auto 0;
  position: relative;
}
.search-ico {
  position: absolute; left: 17px; top: 50%;
  transform: translateY(-50%);
  font-size: 1rem; pointer-events: none;
}
.search-input {
  width: 100%; padding: 13px 16px 13px 45px;
  border: 1.5px solid var(--border); border-radius: var(--r-pill);
  font-size: .95rem; font-family: var(--font);
  background: var(--surface); outline: none;
  box-shadow: var(--shadow-sm); color: var(--text);
  transition: border-color .2s, box-shadow .2s;
}
.search-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px var(--primary-glow);
}
.search-input::placeholder { color: var(--text-3); }

/* ── Filter Bar ── */
.filter-bar {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 8px; padding: 20px 24px 0;
  max-width: 980px; margin: 0 auto;
}
.f-btn {
  padding: 7px 18px; border-radius: var(--r-pill);
  border: 1.5px solid var(--border); background: var(--surface);
  font-size: .83rem; font-family: var(--font); font-weight: 600;
  color: var(--text-2); cursor: pointer; white-space: nowrap;
  box-shadow: var(--shadow-sm);
  transition: all .18s;
}
.f-btn:hover { border-color: var(--primary); color: var(--primary); background: #eff6ff; }
.f-btn.active {
  background: var(--primary); border-color: var(--primary);
  color: #fff; box-shadow: 0 3px 12px rgba(37,99,235,.30);
}

/* ════════════════════════════════
   MAIN / SECTIONS
════════════════════════════════ */
.main { max-width: 1280px; margin: 0 auto; padding: 36px 20px 80px; }

.section { margin-bottom: 44px; }

.section-title {
  display: flex; align-items: center; gap: 10px;
  font-size: 1.1rem; font-weight: 900;
  color: var(--text); margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--border);
}
.type-icon {
  width: 32px; height: 32px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0;
}
.ti-si  { background: #dbeafe; }   /* AI 協思 */
.ti-do  { background: #ede9fe; }   /* AI 協做 */
.ti-ai  { background: #d1fae5; }   /* AI 助理 */
.ti-def { background: #f1f5f9; }

/* ════════════════════════════════
   CARD GRID
════════════════════════════════ */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
  gap: 18px;
}

/* ════════════════════════════════
   CARD
════════════════════════════════ */
.card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: transform .22s, box-shadow .22s, border-color .22s;
  animation: fadeUp .38s ease both;
}
.card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-md);
  border-color: rgba(59,130,246,.35);
}

/* gradient top border on hover */
.card-bar {
  height: 4px;
  background: linear-gradient(90deg, var(--primary), var(--violet-l));
  transform: scaleX(0); transform-origin: left;
  transition: transform .25s;
}
.card:hover .card-bar { transform: scaleX(1); }

.card-body { padding: 16px 18px 12px; flex: 1; display: flex; flex-direction: column; gap: 9px; }

/* category tag */
.cat-tag {
  display: inline-flex; align-items: center;
  font-size: .72rem; font-weight: 700;
  padding: 3px 11px; border-radius: var(--r-pill);
  width: fit-content; letter-spacing: .3px;
}
/* tag colour map — applied via inline style */

/* title + step row */
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.card-title { font-size: 1.05rem; font-weight: 900; color: var(--text); line-height: 1.35; }

.step-badge {
  flex-shrink: 0; min-width: 22px; height: 22px;
  border-radius: 50%; border: 1.5px solid var(--border);
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  font-size: .68rem; font-weight: 800; color: var(--text-2);
  margin-top: 2px;
}

/* content preview */
.card-content {
  font-size: .81rem; color: var(--text-2);
  line-height: 1.72; flex: 1;
  overflow: hidden; max-height: 118px;
  position: relative; white-space: pre-wrap;
}
.card-content::after {
  content: ''; position: absolute;
  bottom: 0; left: 0; right: 0; height: 36px;
  background: linear-gradient(transparent, var(--surface));
}

/* copy btn */
.copy-btn {
  margin: 0 18px 16px;
  padding: 10px 0;
  background: var(--primary); color: #fff;
  border: none; border-radius: var(--r-btn);
  font-family: var(--font); font-size: .88rem; font-weight: 700;
  cursor: pointer; letter-spacing: .3px;
  transition: background .18s, box-shadow .18s, transform .1s;
}
.copy-btn:hover { background: var(--primary-d); box-shadow: 0 4px 14px rgba(37,99,235,.32); }
.copy-btn:active { transform: scale(.97); }
.copy-btn.ok { background: var(--success); }

/* ════════════════════════════════
   MODAL (full prompt)
════════════════════════════════ */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(15,23,42,.55); backdrop-filter: blur(4px);
  z-index: 200; align-items: center; justify-content: center; padding: 24px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border-radius: 18px;
  max-width: 640px; width: 100%; max-height: 82vh;
  display: flex; flex-direction: column;
  box-shadow: 0 24px 64px rgba(0,0,0,.22);
  animation: modalIn .24s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(.94) translateY(12px); }
  to   { opacity: 1; transform: none; }
}
.modal-head {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.modal-title { font-size: 1.1rem; font-weight: 900; color: var(--text); }
.modal-close {
  width: 30px; height: 30px; border-radius: 50%;
  border: none; background: var(--surface-2);
  font-size: 1rem; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2); transition: background .2s;
}
.modal-close:hover { background: #fee2e2; color: #e11d48; }
.modal-content {
  padding: 20px 24px; overflow-y: auto; flex: 1;
  font-size: .88rem; color: var(--text-2);
  line-height: 1.85; white-space: pre-wrap;
}
.modal-foot {
  padding: 14px 24px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 10px;
}
.modal-copy {
  padding: 10px 28px;
  background: var(--primary); color: #fff;
  border: none; border-radius: var(--r-btn);
  font-family: var(--font); font-size: .88rem; font-weight: 700;
  cursor: pointer; transition: background .18s;
}
.modal-copy:hover { background: var(--primary-d); }
.modal-copy.ok { background: var(--success); }

/* ════════════════════════════════
   LOADING / EMPTY
════════════════════════════════ */
.loading { text-align: center; padding: 80px 20px; color: var(--text-3); }
.spinner {
  width: 38px; height: 38px; border-radius: 50%;
  border: 3px solid var(--border); border-top-color: var(--primary);
  animation: spin .7s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 60px 20px; color: var(--text-3); font-size: 1rem; line-height: 2; }
.empty a { color: var(--primary); }

/* ════════════════════════════════
   STATS BAR
════════════════════════════════ */
.stats {
  display: flex; align-items: center; justify-content: center;
  gap: 28px; flex-wrap: wrap;
  padding: 14px 24px 0;
  font-size: .8rem; color: var(--text-3);
}
.stats strong { color: var(--primary); font-weight: 700; }

/* ════════════════════════════════
   ANIMATIONS
════════════════════════════════ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: none; }
}

/* ════════════════════════════════
   FOOTER
════════════════════════════════ */
.footer {
  text-align: center; padding: 28px;
  font-size: .78rem; color: var(--text-3);
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.footer a { color: var(--primary); text-decoration: none; }

/* ════════════════════════════════
   RESPONSIVE
════════════════════════════════ */
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
  .main { padding: 24px 14px 60px; }
  .header { padding: 32px 16px 22px; }
}
</style>
</head>
<body>

<!-- ── HEADER ── -->
<div class="header">
  <h1>🚀 AI Prompt 智能寶庫</h1>
  <a class="sheet-link"
     href="https://docs.google.com/spreadsheets/d/1oe915g8bLKz0h4rr1Ybb6Am97RHzu0mDYJ2pEHczF4U/edit?usp=sharing"
     target="_blank" rel="noopener">
    📊 開啟原始資料 Google Sheet
  </a>

  <!-- Search -->
  <div class="search-wrap">
    <span class="search-ico">🔍</span>
    <input class="search-input" id="searchInput" type="text" placeholder="搜尋提示詞...">
  </div>
</div>

<!-- ── FILTER BAR ── -->
<div class="filter-bar" id="filterBar">
  <button class="f-btn active" data-cat="全部">全部</button>
</div>

<!-- ── STATS ── -->
<div class="stats" id="statsBar"></div>

<!-- ── MAIN ── -->
<div class="main">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div>載入資料中…</div>
  </div>
  <div id="content"></div>
</div>

<!-- ── FOOTER ── -->
<footer class="footer">
  AI Prompt 智能寶庫 · 資料來源：
  <a href="https://docs.google.com/spreadsheets/d/1oe915g8bLKz0h4rr1Ybb6Am97RHzu0mDYJ2pEHczF4U/edit?usp=sharing"
     target="_blank" rel="noopener">Google Sheet</a>
</footer>

<!-- ── MODAL ── -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="modalTitle"></div>
        <div style="font-size:.78rem;color:var(--text-3);margin-top:4px" id="modalMeta"></div>
      </div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-content" id="modalContent"></div>
    <div class="modal-foot">
      <button class="modal-copy" id="modalCopyBtn">複製 Prompt</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════
   CONFIG — change here only
═══════════════════════════ */
const SHEET_ID = '1oe915g8bLKz0h4rr1Ybb6Am97RHzu0mDYJ2pEHczF4U';
const GID      = '1480282197';
const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

/* ═══════════════════════════
   STATE
═══════════════════════════ */
let allData = [];
let activeCategory = '全部';
let searchQuery    = '';

/* ═══════════════════════════
   CSV PARSER (handles quoted newlines/commas)
═══════════════════════════ */
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];
    if (inQ) {
      if (c === '"' && n === '"') { field += '"'; i++; }
      else if (c === '"')          { inQ = false; }
      else                          { field += c; }
    } else {
      if      (c === '"')  { inQ = true; }
      else if (c === ',')  { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); if (row.some(x => x)) rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else                  { field += c; }
    }
  }
  if (field !== '' || row.length) { row.push(field); if (row.some(x => x)) rows.push(row); }
  return rows;
}

/* ═══════════════════════════
   FETCH
═══════════════════════════ */
async function fetchData() {
  const res = await fetch(CSV_URL);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  const rows = parseCSV(text);
  if (rows.length < 2) return [];
  // Row 0 = headers: A=Type B=Category C=Title D=流程 E=Content
  return rows.slice(1).filter(r => (r[2] || '').trim()).map(r => ({
    type:     (r[0] || '').trim(),
    category: (r[1] || '').trim(),
    title:    (r[2] || '').trim(),
    step:     (r[3] || '').trim(),
    content:  (r[4] || '').trim(),
  }));
}

/* ═══════════════════════════
   TAG COLOUR MAP
═══════════════════════════ */
const TAG = {
  '內容創作': ['#dbeafe','#1d4ed8'],
  '程式應用': ['#ede9fe','#5b21b6'],
  '程式生成': ['#fce7f3','#9d174d'],
  '簡報表達': ['#d1fae5','#065f46'],
  '文本優化': ['#ffedd5','#9a3412'],
  '生文校正': ['#ccfbf1','#115e59'],
  '專案企劃': ['#fef9c3','#854d0e'],
  '圖片生成': ['#fce7f3','#86198f'],
  '筆記整理': ['#e0f2fe','#075985'],
  '筆記精煉': ['#e0f2fe','#075985'],
  '資訊整理': ['#f0fdf4','#166534'],
  '心智圖法': ['#fff7ed','#c2410c'],
};
const DEF_TAG = ['#f1f5f9','#475569'];

function tagStyle(cat) {
  const [bg, fg] = TAG[cat] || DEF_TAG;
  return `background:${bg};color:${fg}`;
}

/* ═══════════════════════════
   TYPE META (section headers)
═══════════════════════════ */
const TYPE_META = {
  'AI 協思': { emoji: '🧠', cls: 'ti-si' },
  'AI協思':  { emoji: '🧠', cls: 'ti-si' },
  'AI 協做': { emoji: '🤝', cls: 'ti-do' },
  'AI協做':  { emoji: '🤝', cls: 'ti-do' },
  'AI 助理': { emoji: '⚡', cls: 'ti-ai' },
  'AI助理':  { emoji: '⚡', cls: 'ti-ai' },
};

/* ═══════════════════════════
   BUILD FILTER BAR
═══════════════════════════ */
function buildFilters() {
  const cats = ['全部', ...new Set(allData.map(d => d.category).filter(Boolean))];
  const bar = document.getElementById('filterBar');
  bar.innerHTML = '';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'f-btn' + (cat === activeCategory ? ' active' : '');
    btn.dataset.cat = cat;
    btn.textContent = cat;
    btn.addEventListener('click', () => {
      activeCategory = cat;
      bar.querySelectorAll('.f-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
      render();
    });
    bar.appendChild(btn);
  });
}

/* ═══════════════════════════
   FILTER
═══════════════════════════ */
function getFiltered() {
  const q = searchQuery.trim().toLowerCase();
  return allData.filter(d => {
    const matchCat = activeCategory === '全部' || d.category === activeCategory;
    const matchQ   = !q || [d.title, d.category, d.type, d.content].some(s => s.toLowerCase().includes(q));
    return matchCat && matchQ;
  });
}

/* ═══════════════════════════
   RENDER
═══════════════════════════ */
function render() {
  const content = document.getElementById('content');
  const items   = getFiltered();
  content.innerHTML = '';
  updateStats(items.length);

  if (!items.length) {
    content.innerHTML = '<div class="empty">😕 找不到符合的提示詞</div>';
    return;
  }

  // Group by Type (col A)
  const groups = {};
  items.forEach(d => {
    const key = d.type || '其他';
    (groups[key] = groups[key] || []).push(d);
  });

  let delay = 0;
  for (const [grp, cards] of Object.entries(groups)) {
    const meta = TYPE_META[grp] || { emoji: '📌', cls: 'ti-def' };

    const section = document.createElement('div');
    section.className = 'section';

    // section title
    const titleEl = document.createElement('div');
    titleEl.className = 'section-title';
    titleEl.innerHTML = `<div class="type-icon ${meta.cls}">${meta.emoji}</div>${grp}`;
    section.appendChild(titleEl);

    const grid = document.createElement('div');
    grid.className = 'grid';
    cards.forEach(item => {
      grid.appendChild(makeCard(item, delay));
      delay++;
    });
    section.appendChild(grid);
    content.appendChild(section);
  }
}

/* ═══════════════════════════
   MAKE CARD
═══════════════════════════ */
function makeCard(item, delay) {
  const card = document.createElement('div');
  card.className = 'card';
  card.style.animationDelay = `${Math.min(delay * 38, 500)}ms`;

  // gradient bar
  const bar = document.createElement('div');
  bar.className = 'card-bar';

  // body
  const body = document.createElement('div');
  body.className = 'card-body';

  // tag
  const tag = document.createElement('span');
  tag.className = 'cat-tag';
  tag.setAttribute('style', tagStyle(item.category));
  tag.textContent = item.category || '其他';

  // head row (title + step)
  const head = document.createElement('div');
  head.className = 'card-head';

  const title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = item.title;
  head.appendChild(title);

  if (item.step) {
    const badge = document.createElement('div');
    badge.className = 'step-badge';
    badge.textContent = item.step;
    head.appendChild(badge);
  }

  // content preview
  const preview = document.createElement('div');
  preview.className = 'card-content';
  preview.textContent = item.content;

  body.append(tag, head, preview);
  card.append(bar, body);

  // copy btn
  const btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.textContent = '複製 Prompt';
  btn.addEventListener('click', e => {
    e.stopPropagation();
    copyText(item.content, btn);
  });
  card.appendChild(btn);

  // click → open modal
  card.addEventListener('click', () => openModal(item));

  return card;
}

/* ═══════════════════════════
   COPY HELPER
═══════════════════════════ */
function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✅ 已複製！';
    btn.classList.add('ok');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('ok'); }, 1800);
  });
}

/* ═══════════════════════════
   MODAL
═══════════════════════════ */
function openModal(item) {
  document.getElementById('modalTitle').textContent   = item.title;
  document.getElementById('modalMeta').textContent    = `${item.type}  ·  ${item.category}` + (item.step ? `  ·  流程 ${item.step}` : '');
  document.getElementById('modalContent').textContent = item.content;
  const copyBtn = document.getElementById('modalCopyBtn');
  copyBtn.textContent = '複製 Prompt';
  copyBtn.classList.remove('ok');
  copyBtn.onclick = () => copyText(item.content, copyBtn);
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ═══════════════════════════
   STATS BAR
═══════════════════════════ */
function updateStats(shown) {
  const bar = document.getElementById('statsBar');
  bar.innerHTML = `顯示 <strong>${shown}</strong> 筆 ／ 共 <strong>${allData.length}</strong> 筆`;
}

/* ═══════════════════════════
   SEARCH
═══════════════════════════ */
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

/* ═══════════════════════════
   BOOT
═══════════════════════════ */
(async () => {
  try {
    const data = await fetchData();
    document.getElementById('loading').style.display = 'none';
    allData = data;
    buildFilters();
    render();
  } catch (err) {
    document.getElementById('loading').innerHTML = `
      <div class="empty">
        ⚠️ 無法載入資料（${err.message}）<br>
        請確認 Google Sheet 已設為「知道連結的任何人可以檢視」<br><br>
        <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit" target="_blank">前往試算表設定</a>
      </div>`;
  }
})();
</script>
</body>
</html>
